# HARIS — Docker Compose configuration
#
# Usage:
#   docker compose up              # Start the web UI on port 8000
#   docker compose run --rm cli    # Run a CLI scan interactively
#
# The web UI is available at http://localhost:8000

services:
  web:
    build: .
    ports:
      - "8000:8000"
    mem_limit: 1g
    cpus: "1.0"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./reports:/app/reports
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./templates:/app/templates
      - nuclei-data:/home/haris/nuclei-templates
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # CLI mode: run one-off scans from the command line
  cli:
    build: .
    entrypoint: ["haris"]
    mem_limit: 1g
    cpus: "1.0"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./reports:/app/reports
      - ./data:/app/data
      - ./config:/app/config:ro
      - nuclei-data:/home/haris/nuclei-templates
    env_file:
      - path: .env
        required: false
    profiles:
      - cli

volumes:
  nuclei-data:
