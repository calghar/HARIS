# LLM runtime, budget, pricing, redaction and limits.
# Override by placing a file of the same name in ./config/.
# The model comes from `llm.model`; no model id lives here.

# USD per million tokens, first match wins; else LiteLLM's table, else token cap only.
# - {match: "<model id glob>", input_per_mtok: 0.0, output_per_mtok: 0.0}
pricing: []

runtime:
  timeout_s: 60
  max_retries: 3
  backoff_base_s: 1.0
  backoff_max_s: 30.0
  max_retry_after_s: 120
  max_concurrency: 4
  chars_per_token: 4
  min_output_tokens: 64

# Per-scan caps; null disables a cap.
budget:
  max_tokens: 200000
  max_cost_usd: 2.0

redaction:
  emails: false
  extra_patterns: []

# Findings per call for chain, triage and false-positive stages, and field clips (chars).
limits:
  batch_size: 30
  retrieval_threshold: 15
  title: 200
  description: 500
  evidence: 500
