version: 2
updates:
  # Python dependencies (uv.lock)
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # Keep LLM SDK bumps together (they tend to co-release)
      llm-sdks:
        patterns:
          - "anthropic*"
          - "openai*"
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
