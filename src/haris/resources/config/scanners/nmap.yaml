# Nmap Scanner Configuration
# Extracted from haris/scanners/nmap_scanner.py

# Services that should not normally be exposed to the network
risky_services:
  ftp: "FTP can transmit credentials in cleartext"
  telnet: "Telnet transmits all data in cleartext"
  mysql: "Database port exposed to the network"
  postgresql: "Database port exposed to the network"
  redis: "Redis often has no authentication by default"
  mongodb: "MongoDB may lack authentication"
  memcached: "Memcached should not be publicly accessible"
  elasticsearch: "Elasticsearch may expose sensitive data"

# Default ports to scan
default_ports: "80,443,8080,8443,8000,8888"

# Default extra nmap arguments
default_extra_args:
  - "-sV"
  - "--open"

# Flags accepted from scanner_options.extra_args: flag -> number of values.
extra_args_allowlist:
  "-sV": 0
  "-sT": 0
  "-sS": 0
  "-Pn": 0
  "-n": 0
  "-6": 0
  "--open": 0
  "--reason": 0
  "--version-light": 0
  "--version-all": 0
  "-T0": 0
  "-T1": 0
  "-T2": 0
  "-T3": 0
  "-T4": 0
  "-T5": 0
  "--max-rate": 1
  "--min-rate": 1
  "--max-retries": 1
  "--host-timeout": 1
  "--scan-delay": 1
  "--max-scan-delay": 1
  "--version-intensity": 1
  "--top-ports": 1
