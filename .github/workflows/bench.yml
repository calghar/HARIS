name: Benchmark

on:
  schedule:
    - cron: "0 3 * * *" # Nightly at 03:00 UTC
  workflow_dispatch:
    inputs:
      profile:
        description: "HARIS profile for every target (empty: each target's own profile)"
        default: ""
      baseline_profile:
        description: Profile used as the false-positive baseline (optional)
        default: ""
      runs:
        description: Runs per profile
        default: "3"

permissions:
  contents: read

jobs:
  bench:
    name: Precision and recall
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BENCH_PROFILE: ${{ inputs.profile }}
      BENCH_BASELINE_PROFILE: ${{ inputs.baseline_profile }}
      BENCH_RUNS: ${{ inputs.runs || '3' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra web --extra reporting

      - name: Run benchmark
        # Scores are reported, never gated: the step fails only when a target cannot run.
        run: |
          args=(--runs "$BENCH_RUNS" --haris "uv run haris")
          if [ -n "$BENCH_PROFILE" ]; then
            args+=(--profile "$BENCH_PROFILE")
          fi
          if [ -n "$BENCH_BASELINE_PROFILE" ]; then
            args+=(--baseline-profile "$BENCH_BASELINE_PROFILE")
          fi
          uv run python bench/run.py "${args[@]}"

      - name: Add score summaries to the job summary
        if: always()
        run: |
          for score in bench/results/*/*/runs/score/score.md; do
            [ -f "$score" ] && cat "$score" >> "$GITHUB_STEP_SUMMARY"
          done
          true

      - name: Upload raw artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-results
          path: bench/results/
          if-no-files-found: warn
