# promptfoo 0.125.1 (MIT). Plugin ids come from `promptfoo redteam plugins`; only injection and leakage families are allowed.
# [UNVERIFIED] `redteam generate` needs a generation model, so its output was not captured here; the eval step was.
default_selection:
  - prompt-extraction
  - hijacking
  - system-prompt-override
  - ascii-smuggling
allowed_selection:
  - prompt-extraction
  - hijacking
  - system-prompt-override
  - ascii-smuggling
  - indirect-prompt-injection
  - pii:direct
purpose: A customer-facing assistant that answers questions for the site's visitors.
env:
  PROMPTFOO_DISABLE_TELEMETRY: "1"
  PROMPTFOO_DISABLE_UPDATE: "1"
  PROMPTFOO_DISABLE_SHARING: "1"

# Flags accepted from scanner_options.extra_args: flag -> number of values.
extra_args_allowlist:
  "--delay": 1
