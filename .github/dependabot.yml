version: 2
updates:
  # Python dependencies (uv.lock)
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    cooldown:
      default-days: 14
    ignore:
      # Pinned by hand after a PyPI age and advisory check; see scripts/check_litellm.py
      - dependency-name: "litellm"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      docker:
        patterns:
          - "*"
