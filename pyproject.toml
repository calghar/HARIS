[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haris"
version = "0.7.1"
description = "Black-box web application security audit framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
authors = [
    {name = "HARIS contributors"},
]
keywords = ["security", "audit", "pentest", "owasp", "vulnerability-scanner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]

dependencies = [
    "pydantic>=2.14.3",
    "requests>=2.34.2",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.6",
    "bcrypt>=5.0.0",
    "starlette>=1.10.0",
    "yoyo-migrations>=9.0.0",
]

[project.optional-dependencies]
# Web dashboard
web = [
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.33",
    "authlib>=1.9.5",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "dnspython>=2.8.0",
]
# Report generation extras
reporting = [
    "markdown>=3.11.3",
]
# LLM calls; exact pin and deny-list: scripts/check_litellm.py
llm = [
    "litellm==1.108.0",
]
# Everything installable alongside the web dashboard
all = [
    "haris[web,reporting,llm]",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
    "types-requests",
    "types-PyYAML",
    "types-authlib",
    "bandit[toml]>=1.9.4",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "jsonschema>=4.26.0",
    "types-jsonschema>=4.26.0.20261006",
    "pytest-bdd>=9.0.1",
]
docs = [
    "mkdocs-material>=9.8.1",
]

[project.scripts]
haris = "haris.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["haris*"]

[tool.setuptools.package-data]
haris = [
    "web/templates/**/*",
    "web/static/**/*",
    "llm/templates/**/*",
    "resources/config/**/*",
    "resources/schema/**/*",
    "db/migrations/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "docker: requires a local Docker daemon and the haris-agent-sandbox image",
]
filterwarnings = [
    "ignore:The default datetime adapter:DeprecationWarning",
    "ignore::pytest.PytestUnknownMarkWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TID251"]
# B008: FastAPI's Depends() in function defaults is the standard DI pattern
ignore = ["B008"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Send HTTP through haris.net.ScopedClient."
"httpx".msg = "Send HTTP through haris.net.ScopedClient."
"urllib3".msg = "Send HTTP through haris.net.ScopedClient."

[tool.ruff.lint.per-file-ignores]
"src/haris/net/**" = ["TID251"]
# Fake transports and test servers
"tests/**" = ["TID251"]
# Benchmark harness talks to its own local fixtures
"bench/**" = ["TID251"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "yoyo.*"
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
# B603/B607: scanners intentionally call external tools (nmap, nuclei, etc.) by name
skips = ["B603", "B607"]
