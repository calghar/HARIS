# Seed set from the OWASP Juice Shop companion guide; not a complete list of its challenges.
target: juice_shop
kind: external
entries:
  - id: juice-sqli-login
    method: POST
    url: /rest/user/login
    parameter: email
    vuln_class: sqli_error
    cwe: CWE-89
    expected: true_positive
    source: https://pwning.owasp-juice.shop/companion-guide/latest/part2/injection.html
    notes: Login Admin challenge.
  - id: juice-sqli-search
    method: GET
    url: /rest/products/search
    parameter: q
    vuln_class: sqli_error
    cwe: CWE-89
    expected: true_positive
    source: https://pwning.owasp-juice.shop/companion-guide/latest/part2/injection.html
    notes: Database Schema and User Credentials challenges.
  - id: juice-ftp-listing
    method: GET
    url: /ftp
    vuln_class: directory_listing
    cwe: CWE-548
    expected: true_positive
    source: https://pwning.owasp-juice.shop/companion-guide/latest/part2/sensitive-data-exposure.html
    notes: Confidential Document challenge. HARIS misses it; listing_checks has no /ftp probe and does not match Juice Shop's listing page.
  - id: juice-ftp-robots-nikto
    method: GET
    url: /ftp
    vuln_class: unclassified:nikto:robots-txt-entry-*
    cwe: CWE-548
    expected: true_positive
    source: https://pwning.owasp-juice.shop/companion-guide/latest/part2/sensitive-data-exposure.html
    notes: Nikto's claim that the robots.txt path /ftp/ returns 200, not the directory listing claim (juice-ftp-listing).
  - id: juice-metrics
    method: GET
    url: /metrics
    vuln_class: sensitive_file
    cwe: CWE-538
    expected: true_positive
    source: https://pwning.owasp-juice.shop/companion-guide/latest/part2/sensitive-data-exposure.html
    notes: Exposed Metrics challenge; HARIS reports /metrics as an exposed debug endpoint.
  - id: juice-cors-wildcard
    method: GET
    url: /
    vuln_class: cors_misconfiguration
    cwe: CWE-942
    expected: true_positive
    source: https://github.com/juice-shop/juice-shop
    notes: Every response sends Access-Control-Allow-Origin with a wildcard (checked live).
ignore:
  - vuln_class: no_https
    url: /*
    reason: The target is served over plain HTTP by the compose file.
  - vuln_class: missing_header
    url: /*
    reason: Header set is a property of the target image, not a seeded weakness.
  - vuln_class: banner_disclosure
    url: /*
    reason: Version banner is a property of the target image, not a seeded weakness.
  - vuln_class: sensitive_file
    url: /robots.txt
    reason: Info-level discovery record, not a weakness.
  - vuln_class: sensitive_file
    url: /sitemap.xml
    reason: Info-level discovery record, not a weakness.
  - vuln_class: sensitive_file
    url: /.well-known/security.txt
    reason: Info-level discovery record, not a weakness.
  - vuln_class: unclassified:nikto:uncommon-header-s-x-recruiting-found-with-contents-jobs
    url: /
    reason: Juice Shop sets X-Recruiting on every response; a property of the target image.
