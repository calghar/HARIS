repos:
  # Standard file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^src/haris/web/static/vendor/
      - id: end-of-file-fixer
        exclude: ^src/haris/web/static/vendor/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  # Ruff: lint then format (mirrors CI)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Bandit: SAST — medium+ severity only (mirrors CI)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-ll", "-ii"]
        # -ll = medium+ severity  -ii = medium+ confidence
        # Keeps noise low for a scanner codebase with intentional subprocess calls
