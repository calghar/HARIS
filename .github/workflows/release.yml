name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  version:
    name: Tag matches project version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fail unless the tag equals project.version
        run: |
          python3 -c 'import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          if tag != version:
              sys.exit("tag %s != project.version %s" % (tag, version))
          '

      - name: Check litellm pin and lock
        run: python3 scripts/check_litellm.py

  build:
    name: Build sdist and wheel
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Build distributions
        run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true

  image:
    name: Push and sign GHCR image
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout the tagged commit
      packages: write # push the image and the cosign signature
      id-token: write # keyless cosign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Build and push
        id: push
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/haris
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          name="$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME#v}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build --tag "${name}:${version}" .
          digest="$(docker push "${name}:${version}" | awk '/digest: / { for (i = 1; i <= NF; i++) if ($i ~ /^sha256:/) print $i }' | tail -n 1)"
          test -n "$digest"
          echo "digest=${name}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign the image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$DIGEST"

  release:
    name: Create GitHub Release
    needs: [pypi, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release for this tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          # Pull out the section between this version header and the next one
          NOTES=$(awk "/^## ${VERSION}/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            NOTES="See CHANGELOG.md for details."
          fi

          printf '%s\n' "$NOTES" > /tmp/release-notes.md
          echo "notes_file=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Delete any existing draft release for this tag (from previous failed attempts)
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "${{ steps.notes.outputs.notes_file }}"
